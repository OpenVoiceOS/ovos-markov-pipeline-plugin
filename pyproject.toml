[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-markov-pipeline-plugin"
dynamic = ["version"]
description = "OVOS intent pipeline plugin using Markov chain perplexity ensemble"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "markovonnx>=1.0.1",
    # opm.pipeline entrypoints + the bus-client 2.x stack need modern
    # opm/workshop; bare floors backtrack to ancient releases that still
    # import mycroft_bus_client and break collection.
    "ovos-plugin-manager>=2.3.0a1,<3.0.0",
    "ovos-bus-client>=2.5.1a1,<3.0.0",
    "ovos-spec-tools>=0.17.3a1",
    "ovos-utils>=0.1.0",
]

[project.optional-dependencies]
stem = ["snowballstemmer"]
test = ["pytest", "pytest-cov", "snowballstemmer"]
benchmark = ["padaos", "padatious", "fann2==1.0.7", "nebulento", "datasets"]

[project.entry-points."opm.pipeline"]
ovos-markov-pipeline-plugin = "ovos_markov_pipeline:MarkovPipeline"
ovos-markov-domain-pipeline-plugin = "ovos_markov_pipeline:DomainMarkovPipeline"
ovos-markov-hierarchical-pipeline-plugin = "ovos_markov_pipeline:HierarchicalMarkovPipeline"

[tool.setuptools.dynamic]
version = { attr = "ovos_markov_pipeline.version.__version__" }

[tool.setuptools.packages.find]
include = ["ovos_markov_pipeline*"]

[tool.coverage.run]
source = ["ovos_markov_pipeline"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
