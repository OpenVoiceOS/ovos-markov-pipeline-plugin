line-length = 100
target-version = "py310"

# version.py is managed by automated semver bumping — never reformat it.
extend-exclude = ["ovos_markov_pipeline/version.py"]

[lint]
# pyflakes (F), pycodestyle errors/warnings (E, W), isort (I)
select = ["E", "W", "F", "I"]

[lint.per-file-ignores]
# Example scripts adjust sys.path before importing the package.
"examples/*" = ["E402"]

[format]
quote-style = "double"
